[package]
name    = "urbanlens-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings — real-time scoring in the UrbanLens browser frontend"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
urbanlens-core = { path = "../urbanlens-core" }
wasm-bindgen   = "0.2"
serde          = { workspace = true }
serde_json     = { workspace = true }
js-sys         = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
