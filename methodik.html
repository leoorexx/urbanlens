<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f3ee;--surface:#fff;--surface2:#f0ede6;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --text:#1a1a2e;--text2:#4a4a6a;--muted:#8888aa;
  --accent:#a60ba6;--yellow:#FFD600;
  --climate:#ff8210;--eco:#36d5d0;--social:#a60ba6;
  --measured:#0F6E56;--modeled:#BA7517;--estimated:#5F5E5A;--live:#1D9E75;
  --sh:0 1px 2px rgba(0,0,0,0.05);--font-serif:'Fraunces',Georgia,serif;
}
body{font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
svg.i{vertical-align:-2px}
.nav{position:sticky;top:0;z-index:100;height:54px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 24px;box-shadow:var(--sh)}
.logo{font-size:16px;font-weight:800;text-decoration:none;color:var(--text);letter-spacing:-.4px}
.logo span{color:#36d5d0}
.nav-pill{padding:5px 14px;border-radius:20px;font-size:11px;font-weight:700;text-decoration:none;border:1.5px solid var(--border);color:var(--text2);transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.nav-pill:hover,.nav-pill.active{background:var(--text);color:#fff;border-color:var(--text)}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang-switch{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:14px;border:1px solid var(--border)}
.lg{border:none;background:transparent;padding:4px 9px;border-radius:11px;font-size:11px;font-weight:800;color:var(--muted);cursor:pointer;font-family:inherit}
.lg.on{background:var(--text);color:#fff}
.page{max-width:980px;margin:0 auto;padding:40px 24px 96px}
.lede{font-size:13px;color:var(--text2);max-width:680px;margin-top:10px;line-height:1.7}
h1{font-family:var(--font-serif);font-size:34px;font-weight:500;letter-spacing:-.01em;line-height:1.08}
h2{font-size:18px;font-weight:800;margin:0 0 4px}
.section{margin-top:44px}
.section-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px 24px;box-shadow:var(--sh)}
.conf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.conf{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.conf-dot{width:16px;height:16px;border-radius:50%;display:inline-block;box-sizing:border-box;margin-bottom:8px}
.conf h3{font-size:13px;font-weight:800;margin-bottom:3px}
.conf p{font-size:11px;color:var(--text2);line-height:1.5}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
thead th{background:var(--surface2);text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border)}
tbody td{padding:11px 12px;font-size:11.5px;vertical-align:top;border-bottom:1px solid var(--border)}
tbody tr:last-child td{border-bottom:none}
.dim-name{font-weight:800;white-space:nowrap}
.formula{font-family:ui-monospace,'SF Mono',monospace;font-size:10.5px;color:var(--text2);background:var(--surface2);padding:2px 6px;border-radius:5px;display:inline-block}
.src-prim{color:var(--text);font-weight:600}
.src-val{color:var(--muted);font-size:10.5px}
.cbadge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;white-space:nowrap}
.cbadge .d{width:10px;height:10px;border-radius:50%;display:inline-block;box-sizing:border-box}
.d-measured{background:var(--measured)}
.d-modeled{background:linear-gradient(90deg,var(--modeled) 50%,transparent 50%);border:1.5px solid var(--modeled)}
.d-estimated{border:1.5px solid var(--estimated)}
.d-live{background:var(--live);box-shadow:0 0 0 3px rgba(29,158,117,0.25)}
.vintage{font-size:10.5px;color:var(--muted);white-space:nowrap}
.dl-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.dl-row:last-child{border-bottom:none}
.dl-row b{font-weight:700}
.disclaimer{background:#fef9ec;border:1px solid #f5e2a8;border-radius:14px;padding:18px 22px;font-size:12px;color:#7a5c0a;line-height:1.7}
.cite-box{background:var(--text);color:#e8e6f0;border-radius:14px;padding:18px 22px;font-family:ui-monospace,monospace;font-size:12px;line-height:1.7}
.cite-box .lbl{font-family:'Archivo',-apple-system,sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--yellow);font-weight:800;margin-bottom:8px;display:block}
.muted-note{font-size:10.5px;color:var(--muted);margin-top:8px}
a.ref{color:var(--accent);text-decoration:none}
a.ref:hover{text-decoration:underline}
@media(max-width:760px){.conf-grid{grid-template-columns:repeat(2,1fr)}.page{padding:28px 16px 64px}table{font-size:10px}}
</style>
</head>

<script>
// Sprache: gespeicherte Wahl > Browser nl→NL / de→DE > EN (Launch-Markt EN/NL)
let lang=localStorage.getItem('ul_lang')||(((navigator.language||'').slice(0,2)==='nl')?'nl':(((navigator.language||'').slice(0,2)==='de')?'de':'en'));
function T3(de,en,nl){return lang==='en'?en:lang==='nl'?nl:de;}

const ICONS={thermo:'<path d="M14 14.76V5a2 2 0 0 0-4 0v9.76a4 4 0 1 0 4 0Z"/>',lung:'<path d="M12 4v8M12 12c0 3-2 6-5 6s-4-2-4-5 1-7 3-7 3 2 3 4M12 12c0 3 2 6 5 6s4-2 4-5-1-7-3-7-3 2-3 4"/>',bike:'<circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6h2l-3.5 7H9l-2 4.5"/><path d="m9 13-2-7h3"/>',book:'<path d="M4 19V5a2 2 0 0 1 2-2h14v18H6a2 2 0 0 1-2-2Z"/>',home:'<path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9Z"/>',vote:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/>',tree:'<path d="M12 3 8 9h2l-4 6h12l-4-6h2l-4-6Z"/><path d="M12 15v6"/>',shield:'<path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6l-7-3Z"/>'};
function ic(n){const p=ICONS[n];return p?`<svg class="i" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`:'';}
function cb(t){const lbl={measured:T3('Gemessen','Measured','Gemeten'),modeled:T3('Modelliert','Modelled','Gemodelleerd'),estimated:T3('Geschätzt','Estimated','Geschat'),live:'Live'}[t];const cls={measured:'d-measured',modeled:'d-modeled',estimated:'d-estimated',live:'d-live'}[t];return `<span class="cbadge"><span class="d ${cls}"></span>${lbl}</span>`;}

// Quellen-Spalten bewusst sprachneutral (Eigennamen + internationale Kurzbeschreibung)
const DIMS=[
 {k:'A',icon:'thermo',name:['Klimagerechtigkeit','Climate justice','Klimaatrechtvaardigheid'],formula:['0,40·LST-Perzentil + 0,35·Versiegelung + 0,25·NDVI-Mangel','0.40·LST percentile + 0.35·sealing + 0.25·NDVI deficit','0,40·LST-percentiel + 0,35·verharding + 0,25·NDVI-tekort'],prim:'Copernicus Sentinel-3 (LST)',val:'DWD/KNMI Klimaatlas · HLNUG',val2:'NASA Landsat 8/9 Collection 2 (USGS)',norm:'EU Nature Restoration Reg. 2024/1991',stand:'2024',conf:'measured'},
 {k:'B',icon:'lung',name:['Gesundheitslast','Health burden','Gezondheidslast'],formula:['Luftqualität (PM2.5+NO₂ vs. EU-Grenzwert) + Lärm Lden + Atemwegsrate','Air quality (PM2.5+NO₂ vs EU limit) + noise Lden + respiratory rate','Luchtkwaliteit (PM2.5+NO₂ vs EU-norm) + geluid Lden + luchtwegquote'],prim:'HLNUG/RIVM air network · EU noise mapping',val:'RKI Gesundheitsatlas / RIVM',val2:'EEA Air Quality Index (stations)',norm:'EU Air Quality Directive 2024',stand:'2023',conf:'modeled'},
 {k:'C',icon:'bike',name:['Mobilität','Mobility','Mobiliteit'],formula:['ÖPNV-Takt (GTFS) + Radweglänge/km² + 10-Min-Erreichbarkeit − Unfalldichte','Transit frequency (GTFS) + cycle-path length/km² + 10-min access − crash density','OV-frequentie (GTFS) + fietspad/km² + 10-min-bereik − ongevalsdichtheid'],prim:'GTFS (RMV / NS-OV) · OpenStreetMap',val:'Unfallatlas (Destatis) / SWOV',val2:'openrouteservice / HeiGIT (isochrones)',norm:'SDG 11.2 · 10-minute city',stand:'2024',conf:'modeled'},
 {k:'D',icon:'book',name:['Bildungsstart','Education start','Onderwijsstart'],formula:['Kita-Quote + (1−Abbrecherquote) + (1−Jugendarbeitslosigkeit) − Sozialleistungsquote','Childcare rate + (1−dropout rate) + (1−youth unemployment) − social-assistance rate','Opvangquote + (1−uitval) + (1−jeugdwerkloosheid) − bijstandsquote'],prim:'Utrecht: DUO / CBS · FFM: Statistikportal',val:'UWV / Bundesagentur für Arbeit',val2:'Eurostat Urban Audit (education)',norm:'SDG 4 (childcare >90%)',stand:'2023',conf:'estimated'},
 {k:'E',icon:'home',name:['Wohn-Krise','Housing crisis','Wooncrisis'],formula:['Mietbelastungsquote + Gentrifizierungsdruck (5 J) + Überbelegung','Rent-burden ratio + gentrification pressure (5 yrs) + overcrowding','Huurquote + gentrificatiedruk (5 jr) + overbewoning'],prim:'Utrecht: CBS Wonen · FFM: Zensus',val:'Kadaster / ImmobilienScout24',val2:'Eurostat (housing cost overburden)',norm:'Rent share ≤30% (NL Woningwet / DE WoGG)',stand:'2023',conf:'estimated'},
 {k:'F',icon:'vote',name:['Demokratie & Teilhabe','Democracy & participation','Democratie & participatie'],formula:['Wahlbeteiligung + Vereinsdichte + Community Places / 10.000 EW','Voter turnout + association density + community places / 10k residents','Opkomst + verenigingsdichtheid + buurtplekken / 10k inw.'],prim:'Utrecht: Kiesraad · FFM: Stadtwahlamt',val:'Association registries · OSM',val2:'European Social Survey (ESS)',norm:'Aarhus Convention',stand:'2021',conf:'measured'},
 {k:'G',icon:'tree',name:['Ökosystem-Gesundheit','Ecosystem health','Ecosysteemgezondheid'],formula:['NDVI + Baumvitalität/Kronendichte + Biotopkonnektivität + Wasserretention','NDVI + tree vitality/canopy + biotope connectivity + water retention','NDVI + boomvitaliteit/kroon + biotoopconnectiviteit + waterretentie'],prim:'Copernicus Sentinel-2 (NDVI)',val:'City tree registries · HLNUG',val2:'GBIF / NDFF species records',norm:'EU Nature Restoration Reg. 2024',stand:'2024',conf:'measured'},
 {k:'H',icon:'shield',name:['Katastrophenresilienz','Disaster resilience','Rampbestendigheid'],formula:['Hochwasserrisiko HQ100 (Flächenanteil) + kritische Infrastruktur + Reaktionszeit','Flood risk HQ100 (area share) + critical infrastructure + response time','Overstromingsrisico HQ100 (aandeel) + kritieke infrastructuur + responstijd'],prim:'HLNUG flood maps · Risicokaart NL',val:'Fire services · RP Darmstadt',val2:'JRC Risk Data Hub (EU)',norm:'EU Floods Directive 2007/60/EC',stand:'2023',conf:'measured'},
];
const ENV=[
 {n:['Oberflächentemperatur (LST)','Surface temperature (LST)','Oppervlaktetemperatuur (LST)'],prim:'Copernicus Sentinel-3',val:'DWD/KNMI Klimaatlas',val2:'NASA Landsat 8/9 Collection 2 (USGS)',stand:'2024',conf:'measured'},
 {n:['Versiegelungsgrad','Surface sealing','Verhardingsgraad'],prim:'Copernicus HRL Imperviousness',val:'DUH/LUP Hitze-Check 2026',val2:'ESA WorldCover 10 m (2021)',stand:'2024',conf:'measured'},
 {n:['Grünvolumen / NDVI','Green volume / NDVI','Groenvolume / NDVI'],prim:'Copernicus Sentinel-2',val:'City tree registries (FFM / Utrecht)',val2:'ESA WorldCover / OSM landuse',stand:'2024',conf:'modeled'},
 {n:['Straßenbäume (Einzelbäume)','Street trees (individual)','Straatbomen (individueel)'],prim:'City registries FFM / Utrecht',val:'OpenStreetMap (live)',val2:'Copernicus Urban Atlas — Street Tree Layer',stand:'2024 / realtime',conf:'live'},
 {n:['Hochwasser-Nähe','Flood proximity','Overstromingsnabijheid'],prim:'FFM: HWGK Hessen (HQ100)',val:['Utrecht: Näherung über Gewässer-Distanz (kein Hydraulikmodell)','Utrecht: approximation via distance to waterways (no hydraulic model)','Utrecht: benadering via afstand tot water (geen hydraulisch model)'],val2:'JRC pan-EU flood hazard (HQ100)',stand:'2023/24',conf:'estimated'},
 {n:['Lärmbelastung','Noise exposure','Geluidsbelasting'],prim:'EU Environmental Noise Directive',val:'OSM road-class model',val2:'EEA noise reporting (END round 4)',stand:'2022',conf:'modeled'},
 {n:['Gebäude-CO₂-Intensität','Building CO₂ intensity','Gebouw-CO₂-intensiteit'],prim:['Utrecht: PDOK BAG — echtes Baujahr je Gebäude','Utrecht: PDOK BAG — real construction year per building','Utrecht: PDOK BAG — echt bouwjaar per gebouw'],val:['× Energie-Intensität der Bauepoche (RVO/WoON) · FFM: IWU 2023','× energy intensity of the construction era (RVO/WoON) · FFM: IWU 2023','× energie-intensiteit van het bouwtijdperk (RVO/WoON) · FFM: IWU 2023'],val2:'EP-Online energy labels (NL) · co2online (DE)',stand:'2024',conf:'modeled'},
 {n:['Sozialindikatoren','Social indicators','Sociale indicatoren'],prim:'Utrecht: CBS Kerncijfers wijken 2023 · FFM: Zensus',val:'UWV / Bundesagentur für Arbeit',val2:'Eurostat Urban Audit',stand:'2023',conf:'estimated'},
];
const pick=v=>Array.isArray(v)?T3(v[0],v[1],v[2]):v;

function render(){
  document.documentElement.lang=lang;
  document.title=T3('Inspector Nice — Methodik & Datenquellen','Inspector Nice — Methodology & data sources','Inspector Nice — Methodiek & databronnen');
  ['de','en','nl'].forEach(l=>{const b=document.getElementById('lg-'+l);if(b)b.classList.toggle('on',l===lang);});
  const S=(id,html)=>{const el=document.getElementById(id);if(el)el.innerHTML=html;};
  S('t_navMap',T3('Karte','Map','Kaart'));
  S('t_navMeth',T3('Methodik','Methodology','Methodiek'));
  S('t_stand',T3('Stand: Juli 2026 · v1.1','As of July 2026 · v1.1','Per juli 2026 · v1.1'));
  S('t_h1',T3('Methodik &amp; Datenquellen','Methodology &amp; data sources','Methodiek &amp; databronnen'));
  S('t_lede',T3(
    'Inspector Nice bewertet Stadtteile entlang des NICE Score — 8 Dimensionen, abgeleitet aus 29 dokumentierten Indikatoren über mehr als 30 Datenebenen. Diese Seite dokumentiert für jeden Indikator die Berechnungsformel, die Primärquelle und zwei unabhängige Validierungsquellen, den normativen Bezugsrahmen, den Datenstand und den Konfidenzgrad. Sie ist als zitierfähige Referenz für Verwaltung, Planungsbüros und Forschung gedacht.',
    'Inspector Nice assesses neighbourhoods along the NICE score — 8 dimensions derived from 29 documented indicators across more than 30 data layers. For every indicator, this page documents the calculation formula, the primary source and two independent validation sources, the normative frame of reference, the data vintage and the confidence class. It is meant as a citable reference for public administration, planning offices and research.',
    'Inspector Nice beoordeelt wijken langs de NICE-score — 8 dimensies, afgeleid uit 29 gedocumenteerde indicatoren over meer dan 30 datalagen. Deze pagina documenteert per indicator de rekenformule, de primaire bron en twee onafhankelijke validatiebronnen, het normatieve referentiekader, de datastand en de betrouwbaarheidsklasse. Bedoeld als citeerbare referentie voor overheid, planbureaus en onderzoek.'));

  S('t_cLiveP',T3('Echtzeit aus OpenStreetMap-Overpass oder Sensorik. Wird beim Verschieben der Karte neu geladen. Aktualität maximal, Vollständigkeit je nach Kartierung.','Real-time from OpenStreetMap Overpass or sensors, reloaded as you move the map. Maximum currency; completeness depends on mapping coverage.','Realtime uit OpenStreetMap Overpass of sensoren, herladen bij het verschuiven van de kaart. Maximale actualiteit; volledigheid afhankelijk van de kartering.'));
  S('t_cMeasH',T3('Gemessen','Measured','Gemeten'));

  S('t_cModH',T3('Modelliert','Modelled','Gemodelleerd'));
  S('t_cModP',T3('Aus gemessenen Werten nach dokumentierter Methode berechnet (z.&nbsp;B. CO₂ aus echtem Baujahr × Energie-Intensität der Bauepoche). Mittlere Sicherheit.','Computed from measured values via a documented method (e.g. CO₂ from real construction year × energy intensity of the era). Medium certainty.','Berekend uit gemeten waarden via een gedocumenteerde methode (bijv. CO₂ uit echt bouwjaar × energie-intensiteit van het tijdperk). Gemiddelde zekerheid.'));

  S('t_secNice',T3('NICE Score — Berechnung der 8 Dimensionen','NICE score — how the 8 dimensions are calculated','NICE-score — berekening van de 8 dimensies'));
  S('t_niceLede',T3('NICE Score = ungewichtetes Mittel der 8 Dimensionen (je 0–100, höher = besser). Die Kartenfarbe nutzt Quintile im Stadtvergleich, keinen absoluten Schwellwert.','NICE score = unweighted mean of the 8 dimensions (0–100 each, higher = better). Map colours use quintiles within the city, not absolute thresholds.','NICE-score = ongewogen gemiddelde van de 8 dimensies (elk 0–100, hoger = beter). Kaartkleuren gebruiken kwintielen binnen de stad, geen absolute drempels.'));

  S('t_secEnv',T3('Umweltdaten — dreifach referenziert','Environmental data — triply referenced','Milieudata — drievoudig gerefereerd'));
  S('t_envLede',T3('Jeder Umwelt-Indikator stützt sich auf drei unabhängige Quellen: eine amtliche Primärquelle und zwei unabhängige Sekundärquellen zur Validierung. So werden Messlücken erkannt, systematische Fehler einzelner Datensätze sichtbar und Referenzen abgesichert.','Every environmental indicator rests on three independent sources: an official primary source and two independent secondary sources for validation. This surfaces measurement gaps, exposes systematic errors of single datasets and secures references.','Elke milieu-indicator steunt op drie onafhankelijke bronnen: een officiële primaire bron en twee onafhankelijke secundaire bronnen ter validatie. Zo worden meetgaten zichtbaar, systematische fouten van afzonderlijke datasets herkenbaar en referenties geborgd.'));

  S('t_secBench',T3('Benchmark-Studien — methodischer Anschluss','Benchmark studies — methodological anchoring','Benchmarkstudies — methodische aansluiting'));
  S('t_duh',T3(
    'Die Deutsche Umwelthilfe bewertet 195 deutsche Städte nach Versiegelung, Grünvolumen, Oberflächentemperatur und Bevölkerungsdichte (Ampelsystem rot/gelb/grün). Inspector Nice rechnet diese Methodik auf Stadtteilebene herunter — die DUH bewertet nur Gesamtstädte. Unser Hitzebetroffenheitsindex = 0,35·Versiegelung + 0,35·Oberflächentemperatur-Perzentil + 0,30·(invertiertes Grünvolumen). Grünvolumen geschätzt aus Versiegelungsgrad und Ökosystem-Score. <a class="ref" href="https://www.duh.de/hitze-check/" target="_blank" rel="noopener">duh.de/hitze-check ↗</a>',
    'German Environmental Aid (DUH) rates 195 German cities on sealing, green volume, surface temperature and population density (red/amber/green). Inspector Nice scales this methodology down to district level — DUH only rates whole cities. Our heat-exposure index = 0.35·sealing + 0.35·surface-temperature percentile + 0.30·(inverted green volume). Green volume is estimated from sealing and the ecosystem score. <a class="ref" href="https://www.duh.de/hitze-check/" target="_blank" rel="noopener">duh.de/hitze-check ↗</a>',
    'De Duitse milieuorganisatie DUH beoordeelt 195 Duitse steden op verharding, groenvolume, oppervlaktetemperatuur en bevolkingsdichtheid (rood/geel/groen). Inspector Nice schaalt deze methodiek terug naar wijkniveau — de DUH beoordeelt alleen hele steden. Onze hitte-index = 0,35·verharding + 0,35·temperatuurpercentiel + 0,30·(omgekeerd groenvolume). Groenvolume geschat uit verharding en de ecosysteemscore. <a class="ref" href="https://www.duh.de/hitze-check/" target="_blank" rel="noopener">duh.de/hitze-check ↗</a>'));
  S('t_skl',T3(
    'Universität Freiburg / IfD Allensbach erheben Lebenszufriedenheit (Skala 0–10) über 50 Indikatoren in 13 Kategorien. Kernbefund: entscheidend ist nicht der Durchschnitt, sondern das Zufriedenheitsgefälle — wo die Lücke zwischen zufriedenen und unzufriedenen Vierteln groß ist, sinkt das Glücksniveau der ganzen Stadt. Inspector Nice bildet dieses Gefälle als Kennzahl „Zufriedenheitsgefälle" ab (Spread zwischen bestem und schlechtestem Stadtteil). <a class="ref" href="https://www.skl-gluecksatlas.de/" target="_blank" rel="noopener">skl-gluecksatlas.de ↗</a>',
    'The University of Freiburg / IfD Allensbach survey life satisfaction (scale 0–10) via 50 indicators in 13 categories. Core finding: what matters is not the average but the satisfaction gap — where the gap between satisfied and dissatisfied neighbourhoods is large, the whole city’s happiness drops. Inspector Nice mirrors this as the “satisfaction gap” metric (spread between the best and worst district). <a class="ref" href="https://www.skl-gluecksatlas.de/" target="_blank" rel="noopener">skl-gluecksatlas.de ↗</a>',
    'De Universiteit van Freiburg / IfD Allensbach meten levens­tevredenheid (schaal 0–10) via 50 indicatoren in 13 categorieën. Kernbevinding: niet het gemiddelde telt, maar de tevredenheidskloof — waar de kloof tussen tevreden en ontevreden wijken groot is, daalt het geluksniveau van de hele stad. Inspector Nice toont dit als de maat “tevredenheidskloof” (spreiding tussen beste en slechtste wijk). <a class="ref" href="https://www.skl-gluecksatlas.de/" target="_blank" rel="noopener">skl-gluecksatlas.de ↗</a>'));
  S('t_secVintage',T3('Datenstand — Übersicht','Data vintage — overview','Datastand — overzicht'));

  S('t_secLimits',T3('Grenzen &amp; Haftung','Limitations &amp; liability','Grenzen &amp; aansprakelijkheid'));
  S('t_disclaimer',T3(
    'Inspector Nice ist ein Analyse- und Orientierungswerkzeug, kein amtliches Gutachten. Modellierte und geschätzte Werte (siehe Konfidenzgrad) sind Annäherungen und ersetzen keine fachgutachterliche Prüfung, keinen Energieausweis und keine rechtsverbindliche Hochwasserbewertung. Förder- und Kostenangaben dienen der Orientierung; Konditionen können sich ändern und sind kein Ersatz für individuelle Beratung. Sozialindikatoren liegen amtlich nur auf Stadtteilebene vor; eine feinere Darstellung wäre Schätzung. Für Entscheidungen mit rechtlicher oder finanzieller Tragweite sind die jeweiligen amtlichen Primärquellen heranzuziehen.',
    'Inspector Nice is an analysis and orientation tool, not an official assessment. Modelled and estimated values (see confidence class) are approximations and do not replace expert review, an energy performance certificate, or a legally binding flood assessment. Funding and cost figures are indicative; conditions may change and are no substitute for individual advice. Social indicators are officially available at district level only; anything finer would be estimation. For decisions with legal or financial consequences, consult the respective official primary sources.',
    'Inspector Nice is een analyse- en oriëntatie-instrument, geen officieel rapport. Gemodelleerde en geschatte waarden (zie betrouwbaarheidsklasse) zijn benaderingen en vervangen geen deskundigenonderzoek, geen energielabel en geen juridisch bindende overstromingsbeoordeling. Subsidie- en kostencijfers zijn indicatief; voorwaarden kunnen wijzigen en vervangen geen individueel advies. Sociale indicatoren zijn officieel alleen op wijkniveau beschikbaar; fijner zou schatting zijn. Raadpleeg voor besluiten met juridische of financiële gevolgen de officiële primaire bronnen.'));
