<style>
:root{--bg:#f5f3ee;--surface:#fff;--surface2:#f0ede6;--border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);--text:#1a1a2e;--text2:#4a4a6a;--muted:#6b6b85;--climate:#ff8210;--eco:#36d5d0;--social:#a60ba6;--font-serif:'Fraunces',Georgia,serif;--sh:0 1px 2px rgba(0,0,0,0.05);--shl:0 8px 34px rgba(0,0,0,0.10)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Archivo',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid #1a1a2e;outline-offset:2px;border-radius:4px}
.wrap{max-width:1060px;margin:0 auto;padding:0 24px}
/* NAV */
.nav{position:sticky;top:0;z-index:50;background:rgba(245,243,238,0.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center}
.nav .wrap{display:flex;align-items:center;gap:14px;width:100%}
.logo{font-size:18px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:8px;text-decoration:none}
.logo span{color:var(--eco)}
.navlinks{display:flex;gap:16px;margin-left:10px}
.navlinks a{font-size:13px;font-weight:600;color:var(--text2);text-decoration:none}
.navlinks a:hover{color:var(--text)}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:12px;border:1px solid var(--border)}
.lang button{border:none;background:none;padding:4px 9px;border-radius:9px;font-size:11px;font-weight:800;color:var(--muted);cursor:pointer;font-family:inherit}
.lang button.on{background:#1a1a2e;color:#fff}
.btn{display:inline-flex;align-items:center;gap:7px;background:#1a1a2e;color:#fff;text-decoration:none;border-radius:11px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:transform .1s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--border2)}
.btn.big{padding:13px 24px;font-size:14px}
/* HERO */
.hero{padding:56px 0 40px}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.13em;color:var(--climate);margin-bottom:14px}
h1{font-family:var(--font-serif);font-weight:500;font-size:38px;line-height:1.12;letter-spacing:-.015em;margin-bottom:16px}
.lead{font-size:16px;color:var(--text2);line-height:1.65;margin-bottom:24px;max-width:520px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-ill{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px;box-shadow:var(--shl)}
.tagline{margin-top:16px;font-family:var(--font-serif);font-style:italic;color:var(--text2);font-size:16px}
/* SECTIONS */
section{padding:52px 0;border-top:1px solid var(--border)}
.sec-eye{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin-bottom:10px}
h2{font-family:var(--font-serif);font-weight:500;font-size:30px;line-height:1.15;letter-spacing:-.01em;margin-bottom:10px}
.sub{font-size:15px;color:var(--text2);max-width:640px;margin-bottom:30px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 22px}
.card .ci{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:12px}
.card h3{font-size:15px;font-weight:700;margin-bottom:5px}
.card p{font-size:13px;color:var(--text2);line-height:1.55}
/* Problem-Zahlen */
.probs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.prob{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px}
.prob b{font-family:var(--font-serif);font-weight:500;font-size:34px;line-height:1;display:block;margin-bottom:8px}
.prob.p1 b{color:var(--social)}.prob.p2 b{color:var(--climate)}.prob.p3 b{color:#b34a4a}
.prob p{font-size:13.5px;color:var(--text2);line-height:1.5}
.prob .src{display:block;margin-top:9px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.statstrip{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px 26px;padding:16px 20px;background:#1a1a2e;border-radius:14px;color:#fff}
.statstrip b{font-family:var(--font-serif);font-weight:500;font-size:22px;display:block}
.statstrip span{font-size:11px;color:rgba(255,255,255,.65)}
.statstrip .src{margin-left:auto;font-size:11px;color:rgba(255,255,255,.55);align-self:center;max-width:300px}
/* STEPS */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.step{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;position:relative}
.step .n{font-family:var(--font-serif);font-size:34px;font-weight:500;color:var(--border2);line-height:1;margin-bottom:8px}
.step.s1 .n{color:var(--climate)}.step.s2 .n{color:var(--eco)}.step.s3 .n{color:var(--social)}
.step h3{font-size:16px;font-weight:700;margin-bottom:6px}
.step p{font-size:13px;color:var(--text2);line-height:1.55}
/* Zitat / Mission */
.quote{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--eco);border-radius:0 16px 16px 0;padding:22px 26px;font-family:var(--font-serif);font-size:19px;line-height:1.45;color:var(--text);max-width:760px}
/* trust */
.trust{background:var(--surface2)}
.trust-inner{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.trust-inner .t-tx{flex:1;min-width:260px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:11px;font-weight:700;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 12px;color:var(--text2)}
/* CTA */
.cta{text-align:center;border-top:1px solid var(--border)}
.cta h2{margin-bottom:8px}
.cta .sub{margin:0 auto 24px}
.cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
/* footer */
footer{border-top:1px solid var(--border);padding:26px 0;font-size:12px;color:var(--muted)}
footer .wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
footer a{text-decoration:none}footer a:hover{color:var(--text)}
@media(max-width:820px){.hero-grid,.cards,.steps,.probs{grid-template-columns:1fr}h1{font-size:30px}h2{font-size:25px}.hero{padding:34px 0}.navlinks{display:none}}
</style>
</head>

let lang=localStorage.getItem('ul_lang')||(navigator.language||'en').slice(0,2); if(!T[lang])lang='en';
function setLang(l){lang=l;try{localStorage.setItem('ul_lang',l);}catch(e){}render();}
function render(){
  const t=T[lang]||T.en;
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i');if(t[k]!=null)el.textContent=t[k];});
  ['de','en','nl'].forEach(l=>document.getElementById('lg-'+l).classList.toggle('on',l===lang));
  document.getElementById('heroIll').innerHTML=STREET_ILL;
  document.getElementById('probCards').innerHTML=t.probs.map((p,i)=>'<div class="prob p'+(i+1)+'"><b>'+p[0]+'</b><p>'+p[1]+'<span class="src">'+p[2]+'</span></p></div>').join('');
  document.getElementById('showCards').innerHTML=t.show.map(c=>'<div class="card">'+ico(IC[c[0]],c[1])+'<h3>'+c[2]+'</h3><p>'+c[3]+'</p></div>').join('');
  document.getElementById('stepCards').innerHTML=t.steps.map((s,i)=>'<div class="step s'+(i+1)+'"><div class="n">'+(i+1)+'</div><h3>'+s[0]+'</h3><p>'+s[1]+'</p></div>').join('');
  document.getElementById('whoCards').innerHTML=t.who.map(c=>'<div class="card">'+ico(IC[c[0]],c[1])+'<h3>'+c[2]+'</h3><p>'+c[3]+'</p></div>').join('');
}
render();
</script>
